network:
    name: cnet
    params:
        in_channels: 2
        out_channels: 1
        channels: [16, 16]
        embed_dim: 64
        bias: True


schedule:
    name: geometric
    params:
        sigma_min: 1.0
        sigma_max: 10.0

model:
    decay_rate: 0.999
    device: mps

optimizer:
    name: adam
    params:
        lr: 1.0e-3

lr_scheduler:
    name: cosine
    params:
        T_max: 100
        eta_min: 1.0e-5

trainer:
    file_path: 2dU1CNNrun_001
    use_ddp: false
    checkpoint_dir: ./data/checkpoints
    weight_dir: ./data/weights
    log_dir: logs/runs
    metadata_csv_path: ./data/run_metadata.csv
    save_weight_history: false
    weight_history_frequency: 10

run:
    N_epochs: 500
    batch_size: 512
    early_stopping: .INF
    min_delta: 1.0e-4

sampler:
    name: euler
    params:
        shape: [2_000, 2, 16, 16]
        num_steps: 100
        schedule_type: uniform
        rho: 7.0
        keep_history: false
        # These are ignored by the Euler sampler; they get absorbed into kwargs
        S_churn: 100
        S_noise: 1.0
        std_range: [0.01, 40]
        rescaling_factor: 1.0
        winding_area: 4
        # These are for the MAALA sampler; ignored by the other samplers.
        l_steps: 10
        l_stepsize: 1.0e-4

extra:
    train_beta: 2.000
    train_lattice: [16, 32]
    sample_dir: ./data/samples
    savefile: test_samples.npy
